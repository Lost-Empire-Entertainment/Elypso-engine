kg_files=[ "${kg_files}", "${ext_kg}/files", "copy" ]
kp_stuff=[ "${dir_kp}", "${ext_kp}", "copy" ]
kl_stuff=[ "${dir_kl}", "${ext_kl}", "copy" ]
ka_stuff=[ "${dir_ka}", "${ext_ka}", "copy" ]
kh_license=[ "${dir_kh}/LICENSE.md", "${ext_kh}/LICENSE.md", "copy" ]
kh_readme=[ "${dir_kh}/README.md", "${ext_kh}/README.md", "copy" ]
kh_include=[ "${dir_kh}/include", "${ext_kh}/include", "copy" ]
cg_stuff=[ "${dir_cg}", "${ext_cg}", "copy" ]
hb_stuff=[ "${dir_hb}", "${ext_hb}", "copy" ]
lo_stuff=[ "${dir_lo}", "${ext_lo}", "copy" ]
lua_stuff=[ "${dir_lua}", "${ext_lua}", "copy" ]
ma_stuff=[ "${dir_ma}", "${ext_ma}", "copy" ]
vk_spv_stuff=[ "${dir_vk_spv}", "${ext_spv}", "copy" ]
kw_junk_kh=[ "${ext_kw}/kalaheaders", "", "delete" ]
kw_junk_vk_spv=[ "${ext_kw}/spirv-reflect", "", "delete" ]
kg_junk_kh=[ "${ext_kg}/kalaheaders", "", "delete" ]
kg_junk_cg=[ "${ext_kg}/cgltf", "", "delete" ]
kg_junk_hb=[ "${ext_kg}/harfbuzz", "", "delete" ]
kg_junk_lo=[ "${ext_kg}/lodepng", "", "delete" ]
kg_junk_vk_spv=[ "${ext_kg}/spirv-reflect", "", "delete" ]
kp_junk_kh=[ "${ext_kp}/kalaheaders", "", "delete" ]
kl_junk_kh=[ "${ext_kl}/kalaheaders", "", "delete" ]
kl_junk_lua=[ "${ext_kl}/lua", "", "delete" ]
ka_junk_kh=[ "${ext_ka}/kalaheaders", "", "delete" ]
ka_junk_ma=[ "${ext_ka}/miniaudio", "", "delete" ]

[linux-post-build-sync]
ggt_bin_rel=[ "build/temp/release-linux/game-graphics-template", "build/${version}/game-graphics-template-linux", "copy" ]
ggt_bin_deb=[ "build/temp/debug-linux/game-graphics-template", "build/${version}/game-graphics-template-linuxd", "copy" ]
ggt_license=[ "LICENSE.md", "build/${version}/LICENSE.md", "copy" ]
ggt_readme=[ "README.md", "build/${version}/README.md", "copy" ]
kg_files=[ "${ext_kg}/files", "build/${version}/files", "copy" ]
kg_junk_unlit_vert=[ "build/${version}/files/shaders/unlit.vert", "", "delete" ]
kg_junk_unlit_frag=[ "build/${version}/files/shaders/unlit.frag", "", "delete" ]
kg_junk_ui_rect_vert=[ "build/${version}/files/shaders/ui_rect.vert", "", "delete" ]
kg_junk_ui_rect_frag=[ "build/${version}/files/shaders/ui_rect.frag", "", "delete" ]
kg_junk_ui_font_vert=[ "build/${version}/files/shaders/ui_font.vert", "", "delete" ]
kg_junk_ui_font_frag=[ "build/${version}/files/shaders/ui_font.frag", "", "delete" ]
kg_fonts=[ "files/fonts", "build/${version}/files/fonts", "copy" ]
kg_files_temp_rel=[ "${ext_kg}/files", "build/temp/release-linux/files", "copy" ]
kg_fonts_temp_rel=[ "files/fonts", "build/temp/release-linux/files/fonts", "copy" ]
