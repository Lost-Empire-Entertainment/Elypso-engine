ext_kw="../external/kalawindow"
ext_kg="../external/kalagraphics"
ext_kp="../external/kalaphysics"
ext_ks="../external/kalaserver"
ext_kl="../external/kalalua"
ext_ka="../external/kalaaudio"
ext_kh="../external/kalaheaders"
ext_cg="../external/cgltf"
