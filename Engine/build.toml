[project]
name="elypsoengine"
version="0-0-1"
kmake="project.kmake"

[references]
dir_kw="../../kalawindow/build/1-7-0"
dir_kg="../../kalagraphics/build/0-0-1"
dir_kp="../../kalaphysics/build/0-0-1"
dir_ks="../../kalaserver/build/0-0-1"
dir_kl="../../kalalua/build/1-1-0"
dir_ka="../../kalaaudio/build/1-2-0"
dir_kh="../../kalaheaders"
dir_cg="../../../_forks/cgltf/_build/build/1-15-0"
dir_hb="../../../_forks/harfbuzz/_build/build/14-5-0"
dir_lo="../../../_forks/lodepng/_build/build/1-0-0"
dir_lua="../../../_forks/lua/_build/build/5-5-1"
dir_ma="../../../_forks/miniaudio/_build/build/0-11-25"
dir_vk_spv="../../../_forks/spirv-reflect/_build/build/1-4-363"
