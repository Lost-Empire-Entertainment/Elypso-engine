ext_lo="../external/lodepng"
ext_lua="../external/lua"
ext_ma="../external/miniaudio"
ext_vk="../external/vulkan"
ext_spv="../external/spirv-reflect"
kg_files="../../kalagraphics/files"

[windows-sync]
kw_stuff=[ "${dir_kw}", "${ext_kw}", "copy" ]
kg_stuff=[ "${dir_kg}", "${ext_kg}", "copy" ]
kg_files=[ "${kg_files}", "${ext_kg}/files", "copy" ]
kp_stuff=[ "${dir_kp}", "${ext_kp}", "copy" ]
